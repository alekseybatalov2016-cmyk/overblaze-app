<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OverBlaze</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;user-select:none;
       background:radial-gradient(ellipse at 50% 110%,#3a0e00 0%,#030710 55%,#000 100%);color:#fff4e6;font-family:system-ui,sans-serif;text-align:center}
  img{width:min(320px,40vh);filter:drop-shadow(0 0 40px rgba(255,94,0,.45))}
  button{font:800 40px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#1a0600;border:0;border-radius:999px;
         padding:22px 72px;cursor:pointer;background:linear-gradient(180deg,#ffab1f,#ff5e00);
         box-shadow:0 0 0 3px rgba(255,171,31,.25),0 10px 40px rgba(255,94,0,.55);transition:transform .15s ease,box-shadow .15s ease}
  button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 0 4px rgba(255,171,31,.35),0 14px 50px rgba(255,94,0,.75)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.6;cursor:wait;transform:none}
  p{min-height:1.2em;font-size:15px;color:#c9a88a}
  small{position:fixed;bottom:14px;font-size:12px;color:#6d5a4b}
</style></head>
<body>
  <img src="build/icon.png" alt="OverBlaze">
  <button id="play">Play</button>
  <p id="note"></p>
  <small>F11 fullscreen · Alt+← back to this screen</small>
<script>
  const btn = document.getElementById('play'), note = document.getElementById('note');
  btn.addEventListener('click', async () => {
    btn.disabled = true; note.textContent = 'Connecting…';
    const r = await window.overblaze.play();
    if (r.ok) return;
    btn.disabled = false;
    note.textContent = r.reason === 'network'
      ? "Can't connect. Check your internet connection and try again."
      : 'The game server is offline right now. Please try again later.';
  });
</script>
</body></html>

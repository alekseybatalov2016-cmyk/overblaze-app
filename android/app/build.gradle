plugins { id 'com.android.application' }

android {
    namespace 'com.overblaze.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.overblaze.app'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }
    signingConfigs {
        release {
            // keystore comes from the GitHub secret, written to disk by the build workflow
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.p12')
            storeType 'pkcs12'
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'overblaze'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: Build OverBlaze app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: dist/OverBlaze-Setup.exe
          - os: ubuntu-latest
            script: dist:linux
            files: |
              dist/OverBlaze-Ubuntu.deb
              dist/OverBlaze-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          ls -la out
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "OverBlaze $TAG" --notes "Download OverBlaze for Windows or Ubuntu." --latest
